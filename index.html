<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRADE SECRET: BREACH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc; /* Tailwind slate-50 */
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Card Styles & Animations */
        .game-card {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            transform-style: preserve-3d;
        }
        .game-card:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .game-card.selected {
            ring: 4px;
            transform: translateY(-8px) scale(1.05);
            z-index: 10;
        }
        
        /* Role-specific styling */
        .theme-company { border-color: #10b981; } /* Emerald */
        .text-company { color: #34d399; }
        .bg-company { background-color: rgba(16, 185, 129, 0.1); }
        .glow-company { box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }

        .theme-aggrieved { border-color: #f43f5e; } /* Rose */
        .text-aggrieved { color: #fb7185; }
        .bg-aggrieved { background-color: rgba(244, 63, 94, 0.1); }
        .glow-aggrieved { box-shadow: 0 0 15px rgba(244, 63, 94, 0.3); }

        .theme-lawyer { border-color: #a855f7; } /* Purple */
        .text-lawyer { color: #c084fc; }
        .bg-lawyer { background-color: rgba(168, 85, 247, 0.1); }
        .glow-lawyer { box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); }

        /* Utility animations */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse-text { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        /* SVG Icons defined inline later for performance */
        .icon { width: 24px; height: 24px; display: inline-block; }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">

    <!-- Persistent Nav -->
    <nav class="w-full bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center z-50">
        <div class="text-slate-400 font-bold text-sm tracking-widest pl-2 hidden sm:block">TS: BREACH</div>
        <div class="flex space-x-2 w-full sm:w-auto justify-center">
            <button onclick="showModal('rules')" class="px-3 py-1.5 bg-slate-800 text-slate-300 text-xs font-bold rounded border border-slate-700 hover:bg-slate-700 transition shadow">RULES</button>
            <button onclick="showModal('policy')" class="px-3 py-1.5 bg-slate-800 text-slate-300 text-xs font-bold rounded border border-slate-700 hover:bg-slate-700 transition shadow">POLICY DISCUSSION</button>
            <button onclick="resetGame()" class="px-3 py-1.5 bg-rose-900/30 text-rose-300 text-xs font-bold rounded border border-rose-800 hover:bg-rose-900/60 transition shadow">NEW GAME</button>
        </div>
    </nav>

    <div id="game-container" class="flex-grow flex flex-col w-full max-w-6xl mx-auto p-4 relative">
        
        <!-- Persistent Top Bar (Hidden initially) -->
        <header id="top-bar" class="hidden flex-col md:flex-row justify-between items-center mb-6 bg-slate-800 border border-slate-700 rounded-lg p-4 shadow-lg z-20 relative">
            <div class="flex items-center space-x-4 mb-4 md:mb-0">
                <div class="text-xs text-slate-400 font-mono tracking-widest uppercase">Round</div>
                <div id="ui-round-counter" class="text-2xl font-bold text-white bg-slate-900 px-4 py-1 rounded">1 / 5</div>
            </div>
            
            <div class="flex-grow flex justify-center w-full md:w-auto">
                <div class="border-2 border-amber-500 bg-slate-900/80 rounded-lg px-6 py-2 flex flex-col items-center shadow-[0_0_15px_rgba(245,158,11,0.2)]">
                    <span class="text-xs text-amber-500 font-bold tracking-wider mb-1">THE TRADE SECRET</span>
                    <div class="flex items-center space-x-2">
                        <span class="text-slate-300 text-sm">EXPOSURE:</span>
                        <div class="flex space-x-1" id="ui-strikes">
                            <div class="w-4 h-4 rounded-full border border-rose-500 bg-slate-800 strike-indicator"></div>
                            <div class="w-4 h-4 rounded-full border border-rose-500 bg-slate-800 strike-indicator"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hidden md:flex items-center space-x-2 text-sm text-slate-400">
                <span>Company Wins:</span>
                <span id="ui-company-wins" class="text-emerald-400 font-bold">0</span>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main id="main-view" class="flex-grow flex flex-col items-center justify-center w-full"></main>
    </div>

    <script>
        
        const DISCLAIMER = "This game is an educational simulation about cybersecurity, trade secrets and Indian law. Card values are fictional game mechanics and do not represent actual legal penalties, evidentiary weight, legal probability, or judicial outcomes. Real legal outcomes depend on the facts, applicable law and judicial determination.";

        const TRADE_SECRET_CARD = {
            title: "THE TRADE SECRET",
            value: "SPECIAL — NOT USED IN NUMERICAL SCORING",
            desc: "The Company's most valuable confidential information. It may represent proprietary source code, an algorithm, a manufacturing formula, a customer database, confidential pricing information, or unreleased technology."
        };

        const DECK_COMPANY = [
            { id: 'C1', title: 'ZERO TRUST ARCHITECTURE + RBAC', value: 10, desc: "Verifies users and devices rather than automatically trusting them. Role-Based Access Control limits access to people who need it.", sig: "Protects the secret by limiting who can reach it." },
            { id: 'C2', title: 'END-TO-END + AT-REST ENCRYPTION', value: 9, desc: "Protects information while it is moving and while it is stored.", sig: "Stolen encrypted information may remain unreadable without the required keys." },
            { id: 'C3', title: 'DATA LOSS PREVENTION + IRM', value: 9, desc: "Detects or restricts unauthorized copying, forwarding, exporting or movement of sensitive information.", sig: "Helps prevent confidential information from leaving the Company's control." },
            { id: 'C4', title: 'PRIVILEGED ACCESS MANAGEMENT', value: 9, desc: "Controls powerful administrative accounts and privileged access.", sig: "Reduces the risk that administrative access exposes the Trade Secret." },
            { id: 'C5', title: 'SECRETS MANAGEMENT / HSM', value: 9, desc: "Protects encryption keys and highly sensitive credentials.", sig: "Protecting encrypted information also requires protecting the keys." },
            { id: 'C6', title: 'UEBA — USER & ENTITY BEHAVIOUR ANALYTICS', value: 8, desc: "Detects unusual user or system behaviour.", sig: "Can identify suspicious insider or compromised-account activity." },
            { id: 'C7', title: 'NETWORK SEGMENTATION', value: 8, desc: "Separates systems so compromise of one system does not automatically expose another.", sig: "Limits an attacker's movement toward the Trade Secret." },
            { id: 'C8', title: 'OFFBOARDING PROTOCOL', value: 8, desc: "Revokes access when employees or contractors leave.", sig: "Former users should not retain unnecessary access to confidential information." },
            { id: 'C9', title: 'AIR-GAPPED SYSTEM', value: 8, desc: "Physically or logically isolates highly sensitive systems from ordinary networks.", sig: "Reduces remote attack opportunities." },
            { id: 'C10', title: 'MULTI-FACTOR AUTHENTICATION', value: 7, desc: "Requires more than one authentication factor.", sig: "A stolen password alone should not automatically expose the Trade Secret." },
            { id: 'C11', title: 'SECURITY MONITORING / SOC', value: 8, desc: "Continuously monitors systems for suspicious activity.", sig: "Early detection can prevent or limit trade-secret loss." },
            { id: 'C12', title: 'INCIDENT RESPONSE PLAN', value: 7, desc: "Provides a structured response after a suspected security incident.", sig: "Limits damage and supports evidence preservation." },
            { id: 'C13', title: 'DIGITAL WATERMARKING', value: 6, desc: "Places identifying markers in sensitive files.", sig: "Can help trace a leaked copy and support investigation." },
            { id: 'C14', title: 'EMPLOYEE SECURITY TRAINING', value: 6, desc: "Trains employees to recognize security and confidentiality risks.", sig: "People are part of the security boundary." },
            { id: 'C15', title: 'SECURE BACKUP', value: 6, desc: "Maintains recoverable copies of important business information.", sig: "Improves resilience after a cyber incident." }
        ];

        const DECK_AGGRIEVED = [
            { id: 'A1', title: 'DATA EXTRACTION', value: 10, desc: "Attempts to copy or extract the confidential information.", sig: "Directly targets the company's secret." },
            { id: 'A2', title: 'MALICIOUS INSIDER', value: 10, desc: "A trusted person deliberately abuses their position to obtain or misuse confidential information.", sig: "Shows why insider threats are particularly difficult to manage." },
            { id: 'A3', title: 'INSIDER MISUSE', value: 9, desc: "A person with legitimate access uses that access for an unauthorized purpose.", sig: "Having access does not necessarily mean having permission to copy or disclose everything accessed." },
            { id: 'A4', title: 'SECRET DISCLOSURE', value: 9, desc: "Attempts to disclose confidential information to another person or organization.", sig: "Disclosure can destroy or reduce the commercial value of secrecy." },
            { id: 'A5', title: 'UNAUTHORIZED ACCESS', value: 8, desc: "Attempts to access protected information without permission.", sig: "Authorization is a central issue in cybercrime investigations." },
            { id: 'A6', title: 'CREDENTIAL COMPROMISE', value: 8, desc: "Attempts to obtain access using compromised authentication credentials.", sig: "Shows why authentication is an important security boundary." },
            { id: 'A7', title: 'CLOUD EXFILTRATION', value: 8, desc: "Attempts to move confidential information outside the Company's controlled environment.", sig: "Digital information can be transferred quickly and across organizational boundaries." },
            { id: 'A8', title: 'THIRD-PARTY COMPROMISE', value: 8, desc: "Attempts to reach confidential information through a vendor, contractor or business partner.", sig: "Security risks can extend beyond the Company's own employees and systems." },
            { id: 'A9', title: 'COMPETITOR ACQUISITION', value: 8, desc: "A competitor attempts to obtain or exploit confidential business information.", sig: "Shows how trade-secret disputes can affect competition and business strategy." },
            { id: 'A10', title: 'SOCIAL ENGINEERING', value: 7, desc: "Attempts to manipulate a person into providing access or information.", sig: "Human behaviour can become a pathway to confidential information." },
            { id: 'A11', title: 'SUPPLY-CHAIN ACCESS', value: 7, desc: "Attempts to exploit a connected business relationship to reach sensitive information.", sig: "Trade-secret protection must consider business ecosystems, not only internal systems." },
            { id: 'A12', title: 'UNAUTHORIZED DOWNLOAD', value: 7, desc: "Attempts to download confidential information without authorization.", sig: "Digital copying can happen without removing the original information from the Company." },
            { id: 'A13', title: 'REPEAT ATTEMPT', value: 6, desc: "Attempts again after an earlier attempt failed.", sig: "Cyber incidents may involve persistence rather than a single attempt." },
            { id: 'A14', title: 'COVER-UP', value: 5, desc: "Attempts to conceal evidence of an incident.", sig: "Shows why investigation and digital evidence are important." },
            { id: 'A15', title: 'RECEIVE / RETAIN SECRET', value: 5, desc: "Attempts to retain or benefit from confidential information obtained by another actor.", sig: "Legal issues can continue after the original acquisition of information." }
        ];

        const DECK_LAWYER = [
            { id: 'L1', title: 'IT ACT §43 — UNAUTHORIZED ACCESS / COPYING', value: 2, desc: "Section 43 addresses specified unauthorized acts involving computer resources, including unauthorized access and downloading, copying or extracting data.", sig: "Shows how unauthorized digital access and copying can create legal consequences." },
            { id: 'L2', title: 'IT ACT §66 — COMPUTER-RELATED OFFENCE', value: 2, desc: "Certain conduct covered by Section 43 becomes criminal when the required dishonest or fraudulent element is present.", sig: "Shows the difference between unauthorized computer conduct and a qualifying criminal computer-related offence." },
            { id: 'L3', title: 'IT ACT §66C — IDENTITY THEFT', value: 1, desc: "Concerns fraudulent or dishonest use of another person's password, electronic signature or unique identification feature.", sig: "Shows how compromised credentials can create separate legal issues." },
            { id: 'L4', title: 'IT ACT §72A — DISCLOSURE IN BREACH OF LAWFUL CONTRACT', value: 2, desc: "Addresses certain disclosure of information obtained while providing services under a lawful contract when the statutory conditions are met.", sig: "Shows the relationship between contractual confidentiality and cyber-related information disclosure." },
            { id: 'L5', title: 'BNS §316 — CRIMINAL BREACH OF TRUST', value: 1, desc: "Can apply to qualifying dishonest misappropriation or conversion of entrusted property in circumstances covered by the provision.", sig: "Introduces the idea that misuse of entrusted property can create criminal consequences." },
            { id: 'L6', title: 'BNS §317 — RECEIVING STOLEN PROPERTY', value: 1, desc: "Addresses qualifying dishonest receipt or retention of property known or reasonably believed to be stolen.", sig: "Shows that legal responsibility may extend beyond the original actor in appropriate circumstances." },
            { id: 'L7', title: 'BSA §61–63 — ELECTRONIC / DIGITAL RECORDS', value: 2, desc: "Provides the evidentiary framework for electronic and digital records and their admissibility subject to statutory requirements.", sig: "Shows why digital evidence matters when proving a cyber incident." },
            { id: 'L8', title: 'BSA — BURDEN OF PROOF', value: -1, desc: "Reminds players that an allegation must satisfy the applicable burden of proof.", sig: "Suspicion is not automatically proof." },
            { id: 'L9', title: 'SPECIFIC RELIEF ACT §§37–38 — INJUNCTION', value: 2, desc: "Represents the possibility of temporary or perpetual injunctive relief in appropriate circumstances.", sig: "Shows that legal remedies can sometimes seek to stop harmful conduct rather than only compensate after the event." },
            { id: 'L10', title: 'IT ACT §75 — EXTRATERRITORIAL APPLICATION', value: 1, desc: "Addresses application of the IT Act to certain conduct occurring outside India where statutory conditions are satisfied.", sig: "Shows the jurisdictional difficulties created by cross-border cyber incidents." },
            { id: 'L11', title: 'LACK OF AUTHORIZATION PROOF', value: -2, desc: "Weakens an allegation when evidence does not establish that access was unauthorized.", sig: "Access alone does not automatically establish unlawful access." },
            { id: 'L12', title: 'INSUFFICIENT DIGITAL EVIDENCE', value: -2, desc: "Weakens a legal claim when the available electronic evidence is inadequate to establish the relevant facts.", sig: "Cybercrime investigations depend on reliable evidence." },
            { id: 'L13', title: 'NO CONFIDENTIALITY / NOT A SECRET', value: -2, desc: "Challenges whether the information was actually confidential enough to receive trade-secret protection.", sig: "Calling information a trade secret does not automatically make it one." },
            { id: 'L14', title: 'AUTHORIZED ACCESS / LEGITIMATE PURPOSE', value: -1, desc: "Weakens an unauthorized-access or misuse claim when the facts support legitimate authorization.", sig: "Authorized access and unauthorized use are legally distinct questions." },
            { id: 'L15', title: 'INDEPENDENT DEVELOPMENT / PUBLIC INTEREST', value: 0, desc: "Represents a potentially relevant counterargument requiring contextual legal analysis rather than automatically favouring either side.", sig: "Not every competitor's knowledge or disclosure is automatically trade-secret theft. Context matters." }
        ];


        // Icons as inline SVG strings to avoid external dependencies
        const ICONS = {
            company: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>`,
            aggrieved: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>`,
            lawyer: `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg>`,
            secret: `<svg class="w-8 h-8 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>`
        };

        const STATE = {
            phase: 'START', // START, DEAL, PASS_COMP, SEL_COMP, PASS_AGG, SEL_AGG, REVEAL, PASS_LAW, SEL_LAW, TARGET_LAW, RESOLVE, END
            round: 1,
            maxRounds: 5,
            exposure: 0,
            maxExposure: 2,
            companyWins: 0,
            aggrievedWins: 0,
            players: {
                company: { hand: [], selected: null, tempScore: 0 },
                aggrieved: { hand: [], selected: null, tempScore: 0 },
                lawyer: { hand: [], selected: null, target: null }
            },
            history: [],
            tempSelection: null // Used during card picking before confirmation
        };

        function resetGame() {
            STATE.phase = 'START';
            STATE.round = 1;
            STATE.exposure = 0;
            STATE.companyWins = 0;
            STATE.aggrievedWins = 0;
            STATE.players = {
                company: { hand: [], selected: null, tempScore: 0 },
                aggrieved: { hand: [], selected: null, tempScore: 0 },
                lawyer: { hand: [], selected: null, target: null }
            };
            STATE.history = [];
            STATE.tempSelection = null;
            STATE.finalWinner = null;
            STATE.byReview = false;
            
            closeModal();
            render();
        }

        function showModal(type) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            container.classList.remove('hidden');
            
            let html = `<button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white font-bold text-2xl leading-none">&times;</button>`;
            
            if (type === 'rules') {
                html += `
                    <h2 class="text-2xl font-black text-white mb-6 uppercase tracking-widest border-b border-slate-700 pb-2">Game Rules</h2>
                    <div class="space-y-4 text-slate-300 text-sm">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-slate-900/50 p-3 rounded border border-slate-700">
                                <span class="font-bold text-emerald-400 block mb-1">OBJECTIVE: COMPANY</span>
                                Protects the Trade Secret. Needs 5 round wins to secure it permanently.
                            </div>
                            <div class="bg-slate-900/50 p-3 rounded border border-slate-700">
                                <span class="font-bold text-rose-400 block mb-1">OBJECTIVE: AGGRIEVED</span>
                                Attempts to reveal or breach. Needs 2 round wins to expose the secret.
                            </div>
                            <div class="bg-slate-900/50 p-3 rounded border border-slate-700">
                                <span class="font-bold text-purple-400 block mb-1">OBJECTIVE: LAWYER</span>
                                Influences the legal context. Targets either side to apply their modifier.
                            </div>
                            <div class="bg-slate-900/50 p-3 rounded border border-slate-700">
                                <span class="font-bold text-amber-400 block mb-1">CARDS & HAND</span>
                                15 cards per deck. 5 cards dealt per player. 1 Trade Secret.
                            </div>
                        </div>
                        
                        <div class="bg-slate-900/50 p-4 rounded border border-slate-700 mt-4">
                            <h3 class="font-bold text-white mb-2 uppercase">Gameplay Mechanics</h3>
                            <ul class="list-disc list-inside space-y-1 ml-2">
                                <li><strong>ROUNDS:</strong> Five maximum.</li>
                                <li><strong>CARD LIMIT:</strong> One card per player per round.</li>
                                <li><strong>LAWYER:</strong> Plays one card, chooses target (Company or Aggrieved).</li>
                                <li><strong>SCORING:</strong> Base card value + Lawyer modifier.</li>
                                <li><strong>TIES:</strong> Company wins ties (favors existing protection).</li>
                                <li><strong>UNRESOLVED:</strong> If neither win condition is met after 5 rounds, goes to Final Legal Review.</li>
                            </ul>
                        </div>
                        
                        <div class="text-xs text-amber-500/80 italic mt-4 bg-amber-900/10 p-3 rounded border border-amber-900/30">
                            <strong>Note on Game Balance:</strong> The numerical values (+10, -2, etc.) are fictional game-balance mechanics. They exist only to make the game playable and strategic. Do not describe +10 as "more legally serious" than +8, or +2 as an actual legal advantage. The legal descriptions exist for education.
                        </div>
                        <div class="text-xs text-blue-400/80 italic mt-2 bg-blue-900/10 p-3 rounded border border-blue-900/30">
                            <strong>Central Idea:</strong> A cyber incident is not simply "Hacker versus Company." It is: PROTECTION → ATTACK → EVIDENCE → LEGAL ARGUMENT → OUTCOME.
                        </div>
                    </div>
                `;
            } else if (type === 'policy') {
                const reforms = [
                    { title: "Dedicated trade-secret legislation", do: "Create a standalone statute defining and protecting trade secrets.", ben: "Clarity and specific remedies rather than relying on contract and general law.", con: "May increase litigation or stifle legitimate employee mobility." },
                    { title: "Stronger rules for employee confidentiality", do: "Standardize NDA requirements and limits.", ben: "Employees know exactly what they can and cannot take.", con: "Can trap workers in jobs or prevent them from using their general skills." },
                    { title: "Better digital evidence infrastructure", do: "Streamline forensic procedures for cyber incidents.", ben: "Easier to prove unauthorized access or copying in court.", con: "Requires significant judicial and police training; privacy concerns." },
                    { title: "Cross-border cybercrime cooperation", do: "Fast-track international data sharing for cyber investigations.", ben: "Attackers cannot simply hide data on a foreign server.", con: "Complex treaties, differing human rights and privacy standards." },
                    { title: "Mandatory incident reporting", do: "Require businesses to report serious trade-secret breaches.", ben: "Better national cyber-threat awareness.", con: "Reputational damage to victims; regulatory burden." },
                    { title: "Stronger cybersecurity standards", do: "Mandate specific security frameworks for sensitive businesses.", ben: "Raises the baseline of protection against attacks.", con: "High compliance costs, especially for smaller businesses." },
                    { title: "Better support for small businesses", do: "Subsidize security tools and legal templates for SMEs.", ben: "Protects vulnerable links in the broader supply chain.", con: "Requires public funding and resource allocation." },
                    { title: "Improved employee offboarding standards", do: "Regulate how access is revoked when employees leave.", ben: "Reduces insider misuse after termination.", con: "Difficult to enforce uniformly across all industries." }
                ];
                
                html += `
                    <h2 class="text-2xl font-black text-white mb-6 uppercase tracking-widest border-b border-slate-700 pb-2">Policy & Reform Discussion</h2>
                    <p class="text-slate-400 text-sm mb-6">Consider the following policy reforms. Which approach best balances innovation, security, and fairness?</p>
                    <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar">
                        ${reforms.map(r => `
                            <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700">
                                <h3 class="font-bold text-blue-400 mb-2">${r.title}</h3>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                                    <div><span class="text-slate-500 font-bold block mb-1">WHAT IT WOULD DO</span><span class="text-slate-300">${r.do}</span></div>
                                    <div><span class="text-emerald-500 font-bold block mb-1">POTENTIAL BENEFIT</span><span class="text-slate-300">${r.ben}</span></div>
                                    <div><span class="text-rose-500 font-bold block mb-1">POTENTIAL CONCERN</span><span class="text-slate-300">${r.con}</span></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            content.innerHTML = html;
        }
        
        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        const DOM = {
            main: document.getElementById('main-view'),
            topBar: document.getElementById('top-bar'),
            roundCounter: document.getElementById('ui-round-counter'),
            strikes: document.getElementById('ui-strikes'),
            compWins: document.getElementById('ui-company-wins')
        };

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex > 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }


        function render() {
            DOM.main.innerHTML = ''; // Clear current view
            updateTopBar();

            switch(STATE.phase) {
                case 'START': renderStartScreen(); break;

                case 'SEL_LAW': renderCardSelection('lawyer', 'LAWYER', 'text-lawyer', 'theme-lawyer', 'TARGET_LAW'); break;
                case 'TARGET_LAW': renderLawyerTargeting(); break;
                case 'RESOLVE': renderResolution(); break;

        function selectTempCard(cardId) {

            STATE.tempSelection = cardId;
            const el = document.getElementById(`card-${cardId}`);
            if(el) {

                if(STATE.phase === 'SEL_COMP') ringColor = 'ring-emerald-500';

            btn.className = "px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded transition shadow-lg";
            btn.innerText = "CONFIRM SELECTION";

        function confirmSelection(playerRole, nextPhase) {
            if (!STATE.tempSelection) return;
            
            const hand = STATE.players[playerRole].hand;
            const cardIndex = hand.findIndex(c => c.id === STATE.tempSelection);
            
            if (cardIndex > -1) {
                // Remove card from hand and set as selected
                const card = hand.splice(cardIndex, 1)[0];
                STATE.players[playerRole].selected = card;

                render();
            }

        function runResolutionSequence() {
            const compBase = STATE.players.company.selected.value;
            const aggBase = STATE.players.aggrieved.selected.value;
            const lawMod = STATE.players.lawyer.selected.value;
            const target = STATE.players.lawyer.target;

            let compFinal = compBase;
            let aggFinal = aggBase;

            // Step 1: Apply Modifier (after 1s)
            setTimeout(() => {
                if (target === 'company') {
                    compFinal += lawMod;
                    document.getElementById('res-comp-mod-row').classList.remove('opacity-0');
                    document.getElementById('res-comp-mod').innerText = lawMod > 0 ? `+${lawMod}` : lawMod;
                    document.getElementById('lawyer-overlay-comp').classList.remove('opacity-0');
                } else {
                    aggFinal += lawMod;
                    document.getElementById('res-agg-mod-row').classList.remove('opacity-0');
                    document.getElementById('res-agg-mod').innerText = lawMod > 0 ? `+${lawMod}` : lawMod;
                    document.getElementById('lawyer-overlay-agg').classList.remove('opacity-0');
                }
            }, 1000);

            // Step 2: Show Finals (after 2.5s)
            setTimeout(() => {
                const cFinalEl = document.getElementById('res-comp-final');
                cFinalEl.innerText = compFinal;
                cFinalEl.classList.remove('opacity-0', 'scale-50');
                cFinalEl.classList.add('scale-100');

                const aFinalEl = document.getElementById('res-agg-final');
                aFinalEl.innerText = aggFinal;
                aFinalEl.classList.remove('opacity-0', 'scale-50');
                aFinalEl.classList.add('scale-100');
            }, 2500);

            // Step 3: Announce Winner & Logic (after 4s)
            setTimeout(() => {
                // Game logic: Ties go to company
                let winner;
                
                if (compFinal >= aggFinal) {
                    winner = 'company';
                    STATE.companyWins++;
                } else {
                    winner = 'aggrieved';
                    STATE.exposure++;
                }

                // Determine Lesson based on winning card
                let lessonCat = '';
                let lessonText = '';
                
                if (winner === 'company') {
                    lessonCat = 'CYBERSECURITY LESSON';
                    lessonText = STATE.players.company.selected.sig;
                } else {
                    lessonCat = 'THREAT & VULNERABILITY LESSON';
                    lessonText = STATE.players.aggrieved.selected.sig;
                }
                
                let legalNote = STATE.players.lawyer.selected.sig;

                // Update History
                STATE.history.push({
                    round: STATE.round,
                    compCard: STATE.players.company.selected.title,
                    compBase: compBase,
                    aggCard: STATE.players.aggrieved.selected.title,
                    aggBase: aggBase,
                    lawCard: STATE.players.lawyer.selected.title,
                    target: target,
                    mod: lawMod,
                    compFinal: compFinal,
                    aggFinal: aggFinal,
                    winner: winner,
                    exposure: STATE.exposure,
                    lessonText: lessonText,
                    legalNote: legalNote
                });

                const annEl = document.getElementById('res-announcement');
                const winText = document.getElementById('res-winner-text');
                const subText = document.getElementById('res-sub-text');
                const lessonContainer = document.getElementById('res-lesson-container');
                
                annEl.classList.remove('opacity-0', 'translate-y-10');
                
                lessonContainer.innerHTML = `
                    <div class="mb-4">
                        <span class="text-xs text-amber-500 font-bold uppercase tracking-widest block mb-2 border-b border-amber-900/50 pb-1">${lessonCat}</span>
                        <span class="text-slate-300 text-sm font-medium leading-relaxed">${lessonText}</span>
                    </div>
                    <div>
                        <span class="text-xs text-purple-400 font-bold uppercase tracking-widest block mb-2 border-b border-purple-900/50 pb-1">LEGAL CONTEXT</span>
                        <span class="text-slate-300 text-sm font-medium leading-relaxed">${legalNote}</span>
                    </div>
                `;

                if (winner === 'company') {
                    annEl.classList.add('bg-emerald-900/80', 'border', 'border-emerald-500');
                    if (compFinal === aggFinal) {
                        winText.innerText = "TIE — COMPANY PROTECTED";
                        winText.classList.add('text-emerald-400');
                        subText.innerText = "Ties resolve in favor of existing protection.";
                    } else {
                        winText.innerText = "COMPANY DEFENDS";
                        winText.classList.add('text-emerald-400');
                        subText.innerText = "The Trade Secret remains secure this round.";
                    }
                } else {
                    annEl.classList.add('bg-rose-900/80', 'border', 'border-rose-500');
                    winText.innerText = "AGGRIEVED BREACHES";
                    winText.classList.add('text-rose-400');
                    subText.innerText = "WARNING: Trade Secret Exposure increased.";
                }

                updateTopBar(); // Force UI update to show strikes immediately

                // Show continue button
                setTimeout(() => {
                    const btn = document.getElementById('res-next-btn');
                    btn.classList.remove('opacity-0', 'pointer-events-none');
                }, 1000);

            }, 4000);
        }

        function finishRound() {
            // Check win conditions
            if (STATE.exposure >= STATE.maxExposure) {
                STATE.phase = 'GAME_OVER';
                STATE.finalWinner = 'aggrieved';
                render();
                return;
            }

            if (STATE.round === STATE.maxRounds) {
                if (STATE.companyWins === STATE.maxRounds) {
                    STATE.phase = 'GAME_OVER';
                    STATE.finalWinner = 'company';
                } else {
                    // Unresolved scenario
                    STATE.phase = 'FINAL_REVIEW';
                }
                render();
                return;
            }

            // Next round
            STATE.round++;
            STATE.players.company.selected = null;
            STATE.players.aggrieved.selected = null;
            STATE.players.lawyer.selected = null;
            STATE.players.lawyer.target = null;
            STATE.phase = 'PASS_COMP';
            render();
        }


        function renderFinalReview() {
            DOM.topBar.classList.add('hidden'); // Hide normal top bar for dramatic effect

            let historyRows = STATE.history.map(h => `
                <tr class="border-b border-slate-700 bg-slate-800/30 text-sm">
                    <td class="p-2 text-center text-slate-400 font-mono">${h.round}</td>
                    <td class="p-2">
                        <div class="text-emerald-400 truncate w-32 md:w-48" title="${h.compCard}">${h.compCard}</div>
                    </td>
                    <td class="p-2">
                        <div class="text-rose-400 truncate w-32 md:w-48" title="${h.aggCard}">${h.aggCard}</div>
                    </td>
                    <td class="p-2">
                        <div class="text-purple-400 text-xs">(${h.target === 'company' ? 'C' : 'A'}) ${h.lawCard}</div>
                    </td>
                    <td class="p-2 text-center font-bold ${h.winner === 'company' ? 'text-emerald-500' : 'text-rose-500'}">
                        ${h.winner === 'company' ? 'COMP' : 'AGG'}
                    </td>
                </tr>
            `).join('');

            DOM.main.innerHTML = `
                <div class="w-full max-w-5xl fade-in flex flex-col items-center bg-slate-900 border-2 border-slate-700 rounded-xl p-8 shadow-2xl">
                    <div class="flex items-center text-amber-500 mb-4 gap-2">
                        ${ICONS.lawyer} <span class="font-bold tracking-widest">FINAL LEGAL REVIEW</span> ${ICONS.lawyer}
                    </div>
                    
                    <h2 class="text-3xl md:text-4xl font-black text-white text-center mb-2 uppercase">The Case is Unresolved</h2>
                    <p class="text-slate-400 text-center mb-8 max-w-2xl">
                        The Trade Secret survived 5 rounds, but the Company did not mount a perfect defense, and the Aggrieved Party did not fully breach. The Lawyer must evaluate the totality of the circumstances.
                    </p>

                    <div class="w-full overflow-x-auto mb-8 border border-slate-700 rounded shadow-inner bg-slate-950">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-800 text-slate-300 text-xs uppercase tracking-wider">
                                    <th class="p-3 text-center">Round</th>
                                    <th class="p-3">Company Defense</th>
                                    <th class="p-3">Aggrieved Action</th>
                                    <th class="p-3">Legal Context</th>
                                    <th class="p-3 text-center">Winner</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${historyRows}
                            </tbody>
                        </table>
                    </div>

                    <div class="w-full bg-slate-800/50 p-6 rounded-lg border border-purple-500/30 mb-8">
                        <h3 class="text-purple-400 font-bold mb-4 uppercase text-sm tracking-widest">Questions for Legal Consideration:</h3>
                        <ul class="list-disc list-inside text-slate-300 space-y-2 text-sm ml-4">
                            <li>Was the information actually confidential?</li>
                            <li>Was access authorized or unauthorized?</li>
                            <li>Was copying, extraction or disclosure established?</li>
                            <li>What digital evidence exists based on the played cards?</li>
                            <li>Which legal provision holds the most weight here?</li>
                            <li>Did the Company's security controls adequately protect the information?</li>
                        </ul>
                    </div>

                    <h3 class="text-xl font-bold text-white mb-6">LAWYER: Issue your educational assessment</h3>
                    
                    <div class="flex flex-col md:flex-row gap-6 w-full max-w-2xl">
                        <button onclick="executeFinalJudgment('company')" class="flex-1 p-4 bg-emerald-900/40 hover:bg-emerald-800/60 border-2 border-emerald-500 rounded-xl text-emerald-400 font-bold text-lg transition group">
                            <span class="block text-white mb-1">COMPANY PREVAILS</span>
                            <span class="text-xs font-normal text-emerald-200/70 group-hover:text-emerald-200">Security measures and legal defenses held.</span>
                        </button>
                        <button onclick="executeFinalJudgment('aggrieved')" class="flex-1 p-4 bg-rose-900/40 hover:bg-rose-800/60 border-2 border-rose-500 rounded-xl text-rose-400 font-bold text-lg transition group">
                            <span class="block text-white mb-1">AGGRIEVED PREVAILS</span>
                            <span class="text-xs font-normal text-rose-200/70 group-hover:text-rose-200">Breaches were severe enough to compromise secrecy.</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function executeFinalJudgment(winner) {
            STATE.phase = 'GAME_OVER';
            STATE.finalWinner = winner;
            STATE.byReview = true;
            render();
        }


        function renderGameOver() {
            DOM.topBar.classList.add('hidden');
            const winner = STATE.finalWinner;
            const isAgg = winner === 'aggrieved';
            
            const mainColor = isAgg ? 'text-rose-500' : 'text-emerald-500';
            const bgClass = isAgg ? 'bg-rose-900/20 border-rose-500/50' : 'bg-emerald-900/20 border-emerald-500/50';
            
            let headline, subHeadline, detailsHTML;

            if (isAgg) {
                headline = "TRADE SECRET REVEALED";
                subHeadline = "AGGRIEVED PARTY WINS";
                let reason = STATE.byReview ? 
                    "The Lawyer's Final Review determined the breaches were sufficient to compromise secrecy." : 
                    "Two successful rounds allowed the Aggrieved Party to overcome the Company's protection.";
                
                detailsHTML = `
                    <p class="text-slate-300 text-lg mb-6">${reason}</p>
                    <div class="bg-slate-800/80 p-6 rounded-lg text-left border-l-4 border-rose-500">
                        <h4 class="text-rose-400 font-bold mb-4 uppercase text-sm">Why did the secret become vulnerable?</h4>
                        <ul class="list-disc list-inside text-slate-300 text-sm space-y-4">
                            ${STATE.history.filter(h => h.winner === 'aggrieved').map(h => 
                                `<li>Round ${h.round}: <span class="text-rose-300 font-bold">${h.aggCard}</span> overcame <span class="text-emerald-300">${h.compCard}</span>.<div class="bg-slate-900/50 p-3 rounded mt-2 ml-5 text-slate-400 text-xs border border-slate-700"><strong>Lesson:</strong> ${h.lessonText}<br><strong class="text-purple-400 mt-1 block">Law:</strong> ${h.legalNote}</div></li>`
                            ).join('')}
                        </ul>
                    </div>
                `;
            } else {
                headline = "TRADE SECRET PROTECTED";
                subHeadline = "COMPANY WINS";
                let reason = STATE.byReview ? 
                    "The Lawyer's Final Review determined the Company's security measures and legal defenses held firm." : 
                    "The Company successfully protected the Trade Secret through all five rounds.";
                
                detailsHTML = `
                    <div class="text-purple-400 font-bold mb-4 flex items-center justify-center gap-2">
                        ${ICONS.lawyer} LAWYER WINS WITH COMPANY
                    </div>
                    <p class="text-slate-300 text-lg mb-6">${reason}</p>
                    <div class="bg-slate-800/80 p-6 rounded-lg text-left border-l-4 border-emerald-500">
                        <h4 class="text-emerald-400 font-bold mb-4 uppercase text-sm">What protected the secret?</h4>
                        <ul class="list-disc list-inside text-slate-300 text-sm space-y-4">
                            ${STATE.history.filter(h => h.winner === 'company').map(h => 
                                `<li>Round ${h.round}: <span class="text-emerald-300 font-bold">${h.compCard}</span> defended against <span class="text-rose-300">${h.aggCard}</span>.<div class="bg-slate-900/50 p-3 rounded mt-2 ml-5 text-slate-400 text-xs border border-slate-700"><strong>Lesson:</strong> ${h.lessonText}<br><strong class="text-purple-400 mt-1 block">Law:</strong> ${h.legalNote}</div></li>`
                            ).join('')}
                        </ul>
                    </div>
                `;
            }

            DOM.main.innerHTML = `
                <div class="w-full max-w-4xl fade-in flex flex-col items-center p-8 rounded-2xl border ${bgClass} relative overflow-hidden shadow-2xl">
                    <!-- Background Glow -->
                    <div class="absolute inset-0 ${isAgg ? 'bg-rose-500' : 'bg-emerald-500'} opacity-5 blur-[100px] pointer-events-none"></div>
                    
                    <div class="z-10 w-full text-center">
                        <div class="flex justify-center mb-6 scale-150 ${mainColor}">
                            ${ICONS.secret}
                        </div>
                        
                        <h1 class="text-4xl md:text-5xl font-black text-white mb-2 tracking-tight">${headline}</h1>
                        <h2 class="text-xl font-bold ${mainColor} mb-8 tracking-widest">${subHeadline}</h2>
                        
                        ${detailsHTML}

                        <!-- Educational Summary Section -->
                        <div class="mt-12 w-full text-left bg-slate-900 border border-slate-700 rounded-xl p-6 relative shadow-lg">
                            <div class="absolute -top-4 left-1/2 transform -translate-x-1/2 bg-amber-600 text-white font-black px-6 py-1 text-sm tracking-widest rounded shadow border border-amber-400 whitespace-nowrap">WHAT THIS GAME TEACHES</div>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-3 text-sm text-slate-300 mt-6">
                                <div class="flex items-start"><span class="text-amber-500 mr-2 font-bold">1.</span> Trade secrets depend on secrecy and economic value.</div>
                                <div class="flex items-start"><span class="text-amber-500 mr-2 font-bold">2.</span> Cybersecurity controls can prevent or limit unauthorized access.</div>
                                <div class="flex items-start"><span class="text-amber-500 mr-2 font-bold">3.</span> Insider misuse can be especially difficult to detect.</div>
                                <div class="flex items-start"><span class="text-amber-500 mr-2 font-bold">4.</span> Unauthorized access and unauthorized copying are different questions.</div>
                                <div class="flex items-start"><span class="text-amber-500 mr-2 font-bold">5.</span> Digital evidence can determine whether a claim can be established.</div>
                                <div class="flex items-start"><span class="text-amber-500 mr-2 font-bold">6.</span> Legal provisions have specific elements and do not automatically apply.</div>
                                <div class="flex items-start"><span class="text-amber-500 mr-2 font-bold">7.</span> Contractual confidentiality can matter.</div>
                                <div class="flex items-start"><span class="text-amber-500 mr-2 font-bold">8.</span> Injunctions and other legal remedies can play a role.</div>
                                <div class="flex items-start"><span class="text-amber-500 mr-2 font-bold">9.</span> Cyber incidents can cross borders.</div>
                                <div class="flex items-start"><span class="text-amber-500 mr-2 font-bold">10.</span> Existing legal protection may be fragmented.</div>
                                <div class="flex items-start"><span class="text-amber-500 mr-2 font-bold">11.</span> Good cybersecurity is a preventive legal-risk strategy.</div>
                                <div class="flex items-start"><span class="text-amber-500 mr-2 font-bold">12.</span> Law, technology, evidence and policy all interact.</div>
                            </div>

                            <div class="mt-8 border-t border-slate-700 pt-6">
                                <h3 class="text-blue-400 font-bold mb-4 uppercase tracking-widest text-center text-sm">Discussion Questions</h3>
                                <ul class="space-y-2 text-sm text-slate-400 list-disc list-outside ml-4 md:ml-8">
                                    <li>Should India have a dedicated trade-secret statute?</li>
                                    <li>Is existing cybercrime law sufficient to deal with modern digital trade-secret theft?</li>
                                    <li>How should whistleblowers be treated?</li>
                                    <li>How should companies balance employee mobility with protection of genuine trade secrets?</li>
                                    <li>Should serious trade-secret cyber incidents have mandatory reporting requirements?</li>
                                    <li>How should cross-border digital evidence be handled?</li>
                                </ul>
                            </div>
                        </div>

                        <div class="mt-8 bg-slate-900 p-4 rounded text-xs text-slate-500 border border-slate-800 text-left">
                            <strong>LEGAL DISCLAIMER:</strong> ${DISCLAIMER}
                        </div>

                        <button onclick="resetGame()" class="mt-8 px-10 py-4 bg-slate-700 hover:bg-slate-600 border border-slate-500 text-white font-bold rounded-lg text-lg transition shadow-lg w-full md:w-auto">
                            PLAY AGAIN
                        </button>
                    </div>
                </div>
            `;
        }

        // Initialize App
        window.onload = () => {
            render();
        };

    </script>
    
    <!-- Modals -->
    <div id="modal-container" class="hidden fixed inset-0 z-[100] bg-slate-900/95 backdrop-blur-md overflow-y-auto p-4 flex justify-center items-start pt-10 pb-10">
        <div id="modal-content" class="bg-slate-800 border-2 border-slate-600 rounded-xl max-w-4xl w-full p-8 relative shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            <!-- Content injected here -->
        </div>
    </div>
</body>
</html>
